name: BuildAnchor validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Validate changed repository
        run: uv run buildanchor validate-change --baseline "${{ github.event.pull_request.base.sha }}" --execute --format markdown
