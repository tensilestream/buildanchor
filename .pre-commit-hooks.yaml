- id: buildanchor-validate
  name: BuildAnchor Validate Change
  description: Validates repository Build Truth and change compatibility before commit
  entry: buildanchor validate-change --baseline HEAD --execute
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]

- id: buildanchor-inspect
  name: BuildAnchor Inspect
  description: Verifies repository Build Truth facts and reports detected constraints
  entry: buildanchor inspect --format text
  language: python
  pass_filenames: false
  always_run: true

- id: buildanchor-agent-guidance
  name: BuildAnchor Agent Guidance Up To Date
  description: >-
    Fails when CLAUDE.md / AGENTS.md no longer describe how this repository is
    built and tested. A stale build instruction is worse than none, because an
    agent will trust it.
  entry: buildanchor init --check
  language: python
  pass_filenames: false
  files: '(^|/)(package\.json|pyproject\.toml|pom\.xml|Cargo\.toml|go\.mod|build\.gradle(\.kts)?|pnpm-workspace\.yaml|turbo\.json|nx\.json)$'
  stages: [pre-commit]

- id: buildanchor-verify
  name: BuildAnchor Verify Commands
  description: >-
    Executes a discovery-only probe for each module's test command and fails if
    a command that is advertised as working does not.
  entry: buildanchor verify
  language: python
  pass_filenames: false
  stages: [pre-push]
